name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Demo fixture must produce breaking findings (exit 1)
        run: |
          if npm run dev -- fixtures/ts-violations; then
            echo "ERROR: expected exit code 1 on the demo fixture"
            exit 1
          else
            echo "OK: demo fixture correctly flagged"
          fi
      - name: Stable v2 fixture must pass
        run: node dist/cli.js fixtures/ts-v2-clean --format json
      - name: JSON report must be valid
        run: |
          node dist/cli.js fixtures/ts-v2-hazards --format json --fail-on none --output report.json
          node -e "JSON.parse(require('node:fs').readFileSync('report.json', 'utf8'))"
