name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Demo fixture must produce breaking findings (exit 1)
        run: |
          if npm run dev -- fixtures/ts-violations; then
            echo "ERROR: expected exit code 1 on the demo fixture"
            exit 1
          else
            echo "OK: demo fixture correctly flagged"
          fi
      - name: Stable v2 fixture must pass
        run: node dist/cli.js fixtures/ts-v2-clean --format json
      - name: JSON report must be valid
        run: |
          node dist/cli.js fixtures/ts-v2-hazards --format json --fail-on none --output report.json
          node -e "JSON.parse(require('node:fs').readFileSync('report.json', 'utf8'))"
      - name: SARIF report must be valid JSON with the expected version
        run: |
          node dist/cli.js fixtures/ts-v2-hazards --format sarif --fail-on none --output results.sarif
          node -e "const r=JSON.parse(require('node:fs').readFileSync('results.sarif','utf8')); if(r.version!=='2.1.0'||!Array.isArray(r.runs)) process.exit(1)"

  action-smoke:
    name: Composite Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Clean fixture must pass
        uses: ./
        with:
          path: fixtures/ts-v2-clean
          package-version: 0.2.0
      - name: Breaking fixture must fail
        id: breaking
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/ts-v2-hazards
          package-version: 0.2.0
      - name: Verify failure propagation
        if: always()
        shell: bash
        env:
          BREAKING_OUTCOME: ${{ steps.breaking.outcome }}
        run: |
          if [[ "$BREAKING_OUTCOME" != "failure" ]]; then
            echo "Expected the breaking fixture to fail, got: $BREAKING_OUTCOME"
            exit 1
          fi
