name: False positive
description: Report a rule that flags compatible or unrelated code.
title: "false positive: "
labels: [false-positive, needs-triage]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ts-legacy-handler-context
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-ready version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source example
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this compatible or unrelated?
      description: Mention the SDK version and protocol era when relevant.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Finding output
      description: Paste the finding from terminal or JSON output.
      render: json
    validations:
      required: true
